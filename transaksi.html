<!DOCTYPE html>
<html>
<head>
    <title>Form Pemesanan</title>
</head>

<body bgcolor="#F1F8E9" text="#333333">

    <table border="0" width="100%" cellspacing="0" cellpadding="15">
        <tr bgcolor="#1B5E20">
            <td align="center">
                <font color="#FFFFFF" face="Arial, Helvetica, sans-serif">
                    <h2>FORM PEMESANAN</h2>
                </font>
            </td>
        </tr>
    </table>

    <br><br>

    <form>
        <table border="0" width="55%" align="center" bgcolor="#FFFFFF" cellspacing="0" cellpadding="20">
            <tr>
                <td>
                    <font face="Arial, Helvetica, sans-serif">

                        <center>
                            <font color="#2E7D32">
                                <h3>Data Pemesanan Produk</h3>
                            </font>
                            <hr color="#C8E6C9" size="2" width="40%">
                        </center>
                        <br>

                        <table border="0" width="100%" cellspacing="0" cellpadding="10">
                            <tr bgcolor="#F9FBF7">
                                <td width="35%"><b>Nama Lengkap</b></td>
                                <td width="65%"><input type="text" size="30" style="padding: 5px; font-family: Arial;"></td>
                            </tr>
                            <tr>
                                <td><b>Email</b></td>
                                <td><input type="email" size="30" style="padding: 5px; font-family: Arial;"></td>
                            </tr>
                            <tr bgcolor="#F9FBF7">
                                <td><b>No HP / WhatsApp</b></td>
                                <td><input type="text" size="20" style="padding: 5px; font-family: Arial;"></td>
                            </tr>
                            <tr>
                                <td valign="top"><b>Alamat Kirim</b></td>
                                <td>
                                    <textarea rows="4" cols="35" style="padding: 5px; font-family: Arial;"></textarea>
                                </td>
                            </tr>
                            <tr bgcolor="#F9FBF7">
                                <td><b>Pilih Produk</b></td>
                                <td>
                                    <select style="padding: 5px; font-family: Arial;">
                                        <option>-- Pilih Produk Hidroponik --</option>
                                        <option>Paket Hidroponik Mini</option>
                                        <option>Nutrisi AB Mix 1 Liter</option>
                                        <option>Rockwool Premium</option>
                                        <option>Netpot 50 pcs</option>
                                        <option>Benih Selada</option>
                                        <option>Benih Pakcoy</option>
                                        <option>PH Meter Digital</option>
                                        <option>TDS Meter</option>
                                        <option>Paket NFT Premium</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td><b>Jumlah</b></td>
                                <td><input type="number" value="1" min="1" style="padding: 5px; width: 60px; font-family: Arial;"></td>
                            </tr>
                            <tr bgcolor="#F9FBF7">
                                <td><b>Tanggal Pesan</b></td>
                                <td><input type="date" style="padding: 5px; font-family: Arial;"></td>
                            </tr>
                            <tr>
                                <td valign="top"><b>Metode Pembayaran</b></td>
                                <td>
                                    <table border="0" cellspacing="0" cellpadding="3">
                                        <tr>
                                            <td><input type="radio" name="bayar" id="tf"></td>
                                            <td><label for="tf">Transfer Bank (BCA/Mandiri)</label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="radio" name="bayar" id="qris"></td>
                                            <td><label for="qris">QRIS (Gopay/OVO/Dana)</label></td>
                                        </tr>
                                        <tr>
                                            <td><input type="radio" name="bayar" id="cod"></td>
                                            <td><label for="cod">COD (Bayar di Tempat)</label></td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>

                        <br>
                        <hr color="#E0E0E0" size="1">
                        <br>

                        <center>
                            <input type="submit" value="Pesan Sekarang" style="background-color: #4CAF50; color: white; border: none; padding: 12px 25px; font-family: Arial; font-weight: bold; cursor: pointer;">
                            &nbsp;&nbsp;
                            <input type="reset" value="Reset Form" style="background-color: #E53935; color: white; border: none; padding: 12px 25px; font-family: Arial; font-weight: bold; cursor: pointer;">
                        </center>

                        <br><br>
                        <center>
                            <a href="index.html" style="color: #2E7D32; text-decoration: none;">
                                <b>← Batal dan Kembali ke Katalog</b>
                            </a>
                        </center>

                    </font>
                </td>
            </tr>
        </table>
    </form>

    <br><br>

    <table border="0" width="100%" cellspacing="0" cellpadding="15">
        <tr bgcolor="#1B5E20">
            <td align="center">
                <font color="#FFFFFF" face="Arial, Helvetica, sans-serif" size="2">
                    Copyright © 2026 HABIBIE TOKO HIDROPONIK
                </font>
            </td>
        </tr>
    </table>

</body>
</html>
